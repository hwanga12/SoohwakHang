# Harvest patrol metadata for the rectangular farm_world.
# The patrol keeps the robot on aisle centers and uses inspect stops that cover nearby row groups.

schema_version: 1
frame_id: odom
zone_id: farm_01
world_file: agribot_description/worlds/farm_world.sdf
map_file: agribot_navigation/maps/farm_map.yaml
home_pose_id: farm_01_home
coordinate_rationale:
  description: Harvest patrol follows aisle-center observation stops aligned to the
    rectangular farm grid.
  lane_clearances_m:
    west_outer_aisle: 1.0
    inner_aisles: 1.0
    center_aisle: 2.0
    east_outer_aisle: 1.0
  source_bounds:
    left_bed_edge_x: -8.25
    right_bed_edge_x: 8.25
    front_connector_y: -8.9
    rear_connector_y: 8.9
robot_constraints:
  recommended_travel_speed_mps: 0.35
  recommended_observation_dwell_sec: 0.3
  notes:
  - Keep the robot on aisle centers between crop columns.
  - Use short observation stops and resume the serpentine aisle sweep.
harvest_routing:
  approach_margin_from_bed_edge_m: 0.45
  max_lateral_offset_from_inspect_m: 1.25
  align_standoff_from_crop_m: 0.65
  return_modes:
    default: resume_patrol
    fallback: home
  notes:
  - Approach poses move from the inspect stop toward the observed tomato with a short
    standoff.
  - Align poses square the robot to the crop row so the fixed harvest arm faces the tomato.
  - If patrol resume is unavailable, fall back to the south-center home pose.
waypoints:
- waypoint_id: farm_01_home
  display_name: Home Pose
  purpose: home
  lane_id: staging
  batchable: false
  observe_here: false
  description: Harvest patrol staging pose at the south-center entrance.
  pose:
    x: 0.0
    y: -9.0
    z: 0.0
    yaw: 1.5708
- waypoint_id: farm_01_lane_01_south_entry
  display_name: Harvest Aisle 01 Entry
  purpose: entry
  lane_id: harvest_lane_01
  batchable: true
