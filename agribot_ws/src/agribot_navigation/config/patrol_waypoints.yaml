# Harvest patrol metadata for the widened 4-column farm world.
# The patrol keeps the robot on the widened aisle centers and uses observation stops that cover nearby beds.

schema_version: 1
frame_id: map
zone_id: farm_01
world_file: agribot_description/worlds/farm_world.sdf
map_file: agribot_navigation/maps/farm_map.yaml
home_pose_id: farm_01_home
coordinate_rationale:
  description: Harvest patrol uses widened aisle centers for the symmetric 4-column
    farm layout.
  lane_clearances_m:
    west_outer_aisle: 1.75
    inner_aisles: 1.75
    east_outer_aisle: 1.75
  source_bounds:
    left_bed_edge_x: -6.25
    right_bed_edge_x: 6.25
    front_connector_y: -8.6
    rear_connector_y: 8.6
robot_constraints:
  recommended_travel_speed_mps: 0.35
  recommended_observation_dwell_sec: 0.3
  notes:
  - Keep the robot on the widened aisle centers between crop columns.
  - Use only the north and south connector bands for lane changes.
harvest_routing:
  approach_margin_from_bed_edge_m: 0.45
  max_lateral_offset_from_inspect_m: 1.25
  return_modes:
    default: resume_patrol
    fallback: home
  notes:
  - Approach poses move from the inspect stop toward the observed tomato with a short
    standoff.
  - If patrol resume is unavailable, fall back to the south-center home pose.
waypoints:
- waypoint_id: farm_01_home
  display_name: Home Pose
  purpose: home
  lane_id: staging
  batchable: false
  observe_here: false
  description: Harvest patrol staging pose at the south-center entrance.
  pose:
    x: 0.0
    y: -8.6
    z: 0.0
    yaw: 1.5708
