# Row-level patrol coordinates for S14P-205.
# The patrol stays in the center aisle and uses row-level observation anchors
# instead of sending Nav2 to every individual plant.

schema_version: 1
frame_id: odom
zone_id: greenhouse_01
world_file: agribot_description/worlds/farm_world.sdf
map_file: agribot_navigation/maps/greenhouse_map.yaml
home_pose_id: greenhouse_01_home

coordinate_rationale:
  description: Patrol lanes are offset into the center aisle so Nav2 can observe crop beds without entering occupied crop-bed cells.
  lane_clearances_m:
    left_row_lane: 2.41
    right_row_lane: 2.77
  source_bounds:
    left_bed_edge_x: -12.4095
    right_bed_edge_x: 15.7679
    front_connector_y: 12.0
    rear_connector_y: 220.0

robot_constraints:
  recommended_travel_speed_mps: 0.20
  recommended_observation_dwell_sec: 3.0
  notes:
    - Keep the robot in the center aisle during patrol.
    - Harvest approach poses should stay inside the aisle-side crop-bed edge margin.

harvest_routing:
  approach_margin_from_bed_edge_m: 0.45
  max_lateral_offset_from_inspect_m: 2.50
  return_modes:
    default: resume_patrol
    fallback: home
  notes:
    - Harvest approach poses are projected from the observed tomato toward the crop-bed edge while staying inside the navigation aisle.
    - If patrol resume is not possible, fall back to the configured home pose.

waypoints:
  - waypoint_id: greenhouse_01_home
    display_name: Home Pose
    purpose: home
    description: Initial staging pose just inside the entrance gap before a patrol starts or after it finishes.
    pose:
      x: 0.0
      y: 2.0
      z: 0.0
      yaw: 1.5708
  - waypoint_id: greenhouse_01_front_connector
    display_name: Front Connector
    purpose: connector
    description: Safe front cross-aisle connector used to enter the left lane and to return home after the right lane finishes.
    pose:
      x: 0.0
      y: 12.0
      z: 0.0
      yaw: 1.5708
  - waypoint_id: greenhouse_01_rear_connector
    display_name: Rear Connector
    purpose: connector
    description: Safe rear cross-aisle connector used to transfer from the left lane to the right lane.
    pose:
      x: 0.0
      y: 220.0
      z: 0.0
      yaw: 0.0
  - waypoint_id: greenhouse_01_left_entry
    display_name: Left Lane Entry
    purpose: entry
    description: Entry pose for the left crop-bed patrol lane, aligned northbound in the center aisle.
    pose:
      x: -10.0
      y: 12.0
      z: 0.0
      yaw: 1.5708
  - waypoint_id: greenhouse_01_left_front_inspect
    display_name: Left Front Inspection
    purpose: inspect
    description: Front observation pose covering the entrance-side left crop bed.
    pose:
      x: -10.0
      y: 14.0
      z: 0.0
      yaw: 3.1416
    observed_plant_ids:
      - gh01_plant_01
    observed_tomato_ids:
      - gh01_plant_01_tomato_01
  - waypoint_id: greenhouse_01_left_front_mid_inspect
    display_name: Left Front-Mid Inspection
    purpose: inspect
    description: Observation pose for the dense front-middle cluster on the left crop bed.
    pose:
      x: -10.0
      y: 42.0
      z: 0.0
      yaw: 3.1416
    observed_plant_ids:
      - gh01_plant_06
      - gh01_plant_07
    observed_tomato_ids:
      - gh01_plant_06_tomato_01
      - gh01_plant_07_tomato_01
  - waypoint_id: greenhouse_01_left_mid_inspect
    display_name: Left Mid Inspection
    purpose: inspect
    description: Observation pose for the center of the left crop bed.
    pose:
      x: -10.0
      y: 114.0
      z: 0.0
      yaw: 3.1416
    observed_plant_ids:
      - gh01_plant_05
    observed_tomato_ids:
      - gh01_plant_05_tomato_01
  - waypoint_id: greenhouse_01_left_rear_mid_inspect
    display_name: Left Rear-Mid Inspection
    purpose: inspect
    description: Observation pose for the main rear crop cluster on the left side.
    pose:
      x: -10.0
      y: 178.0
      z: 0.0
      yaw: 3.1416
    observed_plant_ids:
      - gh01_plant_10
      - gh01_plant_03
    observed_tomato_ids:
      - gh01_plant_10_tomato_01
      - gh01_plant_03_tomato_01
  - waypoint_id: greenhouse_01_left_rear_end_inspect
    display_name: Left Rear-End Inspection
    purpose: inspect
    description: Final observation pose for the rear-most left crop bed target near the back wall.
    pose:
      x: -10.0
      y: 220.0
      z: 0.0
      yaw: 3.1416
    observed_plant_ids:
      - gh01_plant_08
    observed_tomato_ids:
      - gh01_plant_08_tomato_01
  - waypoint_id: greenhouse_01_left_turn
    display_name: Left Lane Turn
    purpose: turn
    description: Rear turning anchor used to finish the left lane and hand off to the rear connector.
    pose:
      x: -10.0
      y: 224.0
      z: 0.0
      yaw: 0.0
  - waypoint_id: greenhouse_01_right_entry
    display_name: Right Lane Entry
    purpose: entry
    description: Entry pose for the right crop-bed patrol lane, aligned southbound after the rear connector transfer.
    pose:
      x: 13.0
      y: 220.0
      z: 0.0
      yaw: -1.5708
  - waypoint_id: greenhouse_01_right_rear_inspect
    display_name: Right Rear Inspection
    purpose: inspect
    description: Observation pose for the rear-most right crop bed target.
    pose:
      x: 13.0
      y: 166.0
      z: 0.0
      yaw: 0.0
    observed_plant_ids:
      - gh01_plant_09
    observed_tomato_ids:
      - gh01_plant_09_tomato_01
  - waypoint_id: greenhouse_01_right_mid_inspect
    display_name: Right Mid Inspection
    purpose: inspect
    description: Observation pose for the center of the right crop bed.
    pose:
      x: 13.0
      y: 124.0
      z: 0.0
      yaw: 0.0
    observed_plant_ids:
      - gh01_plant_04
    observed_tomato_ids:
      - gh01_plant_04_tomato_01
  - waypoint_id: greenhouse_01_right_front_inspect
    display_name: Right Front Inspection
    purpose: inspect
    description: Observation pose for the entrance-side right crop bed.
    pose:
      x: 13.0
      y: 38.0
      z: 0.0
      yaw: 0.0
    observed_plant_ids:
      - gh01_plant_02
    observed_tomato_ids:
      - gh01_plant_02_tomato_01
  - waypoint_id: greenhouse_01_right_turn
    display_name: Right Lane Turn
    purpose: turn
    description: Front turning anchor used to finish the right lane and return to the front connector.
    pose:
      x: 13.0
      y: 12.0
      z: 0.0
      yaw: 3.1416

routes:
  - route_id: greenhouse_01_left_bed_northbound
    display_name: Left Crop Bed Northbound Patrol
    zone_id: greenhouse_01
    lane_side: left
    description: Patrol the left crop bed from the front connector toward the rear connector while staying in the center aisle.
    entry_pose_id: greenhouse_01_left_entry
    inspect_pose_ids:
      - greenhouse_01_left_front_inspect
      - greenhouse_01_left_front_mid_inspect
      - greenhouse_01_left_mid_inspect
      - greenhouse_01_left_rear_mid_inspect
      - greenhouse_01_left_rear_end_inspect
    turn_pose_id: greenhouse_01_left_turn
    exit_pose_id: greenhouse_01_rear_connector
    observed_plant_ids:
      - gh01_plant_01
      - gh01_plant_06
      - gh01_plant_07
      - gh01_plant_05
      - gh01_plant_10
      - gh01_plant_03
      - gh01_plant_08
    observed_tomato_ids:
      - gh01_plant_01_tomato_01
      - gh01_plant_06_tomato_01
      - gh01_plant_07_tomato_01
      - gh01_plant_05_tomato_01
      - gh01_plant_10_tomato_01
      - gh01_plant_03_tomato_01
      - gh01_plant_08_tomato_01
  - route_id: greenhouse_01_right_bed_southbound
    display_name: Right Crop Bed Southbound Patrol
    zone_id: greenhouse_01
    lane_side: right
    description: Patrol the right crop bed from the rear connector back to the front connector while staying in the center aisle.
    entry_pose_id: greenhouse_01_right_entry
    inspect_pose_ids:
      - greenhouse_01_right_rear_inspect
      - greenhouse_01_right_mid_inspect
      - greenhouse_01_right_front_inspect
    turn_pose_id: greenhouse_01_right_turn
    exit_pose_id: greenhouse_01_front_connector
    observed_plant_ids:
      - gh01_plant_09
      - gh01_plant_04
      - gh01_plant_02
    observed_tomato_ids:
      - gh01_plant_09_tomato_01
      - gh01_plant_04_tomato_01
      - gh01_plant_02_tomato_01

default_patrol_sequence:
  - greenhouse_01_home
  - greenhouse_01_front_connector
  - greenhouse_01_left_entry
  - greenhouse_01_left_front_inspect
  - greenhouse_01_left_front_mid_inspect
  - greenhouse_01_left_mid_inspect
  - greenhouse_01_left_rear_mid_inspect
  - greenhouse_01_left_rear_end_inspect
  - greenhouse_01_left_turn
  - greenhouse_01_rear_connector
  - greenhouse_01_right_entry
  - greenhouse_01_right_rear_inspect
  - greenhouse_01_right_mid_inspect
  - greenhouse_01_right_front_inspect
  - greenhouse_01_right_turn
  - greenhouse_01_front_connector
  - greenhouse_01_home
