# Mapping-specific sweep plan for the rectangular 20x20m farm_world.
# This file keeps a lightweight serpentine sweep so patrol-first mapping
# covers every aisle with minimal stop-and-go before frontier hole-fill.

schema_version: 1
frame_id: odom
zone_id: farm_01
world_file: agribot_description/worlds/farm_world.sdf
map_file: agribot_navigation/maps/farm_map.yaml
home_pose_id: farm_01_home

coordinate_rationale:
  description: Start from the Gazebo spawn on the center aisle, clear the center and east block first, then cross once to finish the west block.
  lane_clearances_m:
    west_outer_aisle: 0.75
    inner_aisles: 1.50
    center_aisle: 3.50
    east_outer_aisle: 0.75
  source_bounds:
    left_bed_edge_x: -8.25
    right_bed_edge_x: 8.25
    front_connector_y: -6.80
    rear_connector_y: 6.80

robot_constraints:
  recommended_travel_speed_mps: 0.40
  recommended_observation_dwell_sec: 0.0
  notes:
    - Keep the robot on the aisle centers between crop rows.
    - Prefer long straight traversals and only turn at the south or north cross-aisle gaps.

harvest_routing:
  approach_margin_from_bed_edge_m: 0.40
  max_lateral_offset_from_inspect_m: 1.20
  return_modes:
    default: home
    fallback: home
  notes:
    - This mapping-specific plan is for sweep coverage only.
    - Harvest routing should keep using the greenhouse patrol metadata until crop instances are realigned.

waypoints:
  - waypoint_id: farm_01_home
    display_name: Home Pose
    purpose: home
    lane_id: staging
    batchable: false
    observe_here: false
    description: Start pose aligned with the Gazebo spawn on the center aisle.
    pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 1.5708

  - waypoint_id: farm_01_lane_01_south
    display_name: West Outer South
    purpose: entry
    lane_id: sweep_01
    batchable: true
    observe_here: false
    description: South start for the west outer aisle.
    pose:
      x: -9.0
      y: -6.8
      z: 0.0
      yaw: 1.5708
