# Single source of truth for greenhouse zone IDs.
# Even with one greenhouse object, keep one explicit zone so ROS topics,
# IoT mappings, plant metadata, and backend rows all reuse the same zone_id.

schema_version: 1
frame_id: map
default_zone_id: greenhouse_01

zones:
  - zone_id: greenhouse_01
    display_name: Greenhouse 01
    description: Single operational zone covering the only greenhouse in farm_world.sdf.
    representative_pose:
      x: 0.0
      y: 112.5
      z: 0.0
      yaw: 0.0
    bounds:
      min_x: -30.0
      max_x: 30.0
      min_y: -5.0
      max_y: 230.0
    source:
      world_file: agribot_description/worlds/farm_world.sdf
      greenhouse_model_name: greenhouse
